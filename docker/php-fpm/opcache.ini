; OPcache tuning for production (see SEO plan §5.6.1 — Core Web Vitals/LCP
; depend on server response time, and this codebase's opcache extension was
; installed but never explicitly tuned, so every setting below defaulted to
; php.ini-production's conservative stock values (8MB memory_consumption,
; 10000 max_accelerated_files) — undersized for a catalog-scale Laravel app
; with a large class/route/config surface.
;
; validate_timestamps is DELIBERATELY left at 1 (the default), not 0: 0 would
; skip checking whether a source file changed since it was cached, which
; only stays safe if something in the deploy pipeline explicitly resets
; opcache (a FastCGI restart, an opcache_reset() call, or equivalent) after
; every deploy — no such step exists anywhere in this repo today. Getting
; that wrong means a deploy silently doesn't take effect until the
; container/pool restarts on its own, which is a worse production risk than
; the small per-request mtime-check cost this setting accepts instead.
; revalidate_freq=0 makes that check happen on every request (rather than
; only every N seconds), so this is exactly as deploy-safe as having no
; opcache at all — the win here is purely skipping re-parsing unchanged
; files' bytecode, not caching stale code.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; JIT — PHP 8.3's function+tracing JIT, enabled via a non-zero buffer size.
; Laravel's own request lifecycle is mostly I/O-bound (DB/Redis/HTTP calls
; JIT can't speed up), so the win here is smaller than for compute-heavy
; code, but it's free once opcache is already tuned and carries no
; deploy-safety caveat the way validate_timestamps=0 does.
opcache.jit_buffer_size=64M
