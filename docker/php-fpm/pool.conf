; Wraps deploy/php-fpm/oeparts-pool-overrides.conf (bind-mounted by compose.yaml
; to /etc/oeparts/php-fpm-pool-overrides.conf, deliberately OUTSIDE this image's
; php-fpm.d/ glob-include directory — see below) in a [www] section.
;
; That file's own directives (php_admin_value[...]) are pool-scoped: its own
; header comment says to paste them into an existing [www] block. But this
; image's /usr/local/etc/php-fpm.conf does `include=.../php-fpm.d/*.conf` at
; the GLOBAL scope, so if the file sat directly in php-fpm.d/ its pool-only
; directives would load at global scope and fail ("Array are not allowed in
; the global section") — confirmed empirically. `include=` on the next line
; runs where it's written, so wrapping it here pulls its lines into the
; already-open [www] pool from the base image's own www.conf/docker.conf
; (php-fpm merges same-named [www] sections across included files).
[www]
include=/etc/oeparts/php-fpm-pool-overrides.conf
