# Docker mirror of deploy/nginx/oeparts.conf — used by the `nginx` compose
# profile (docker compose --profile nginx up) so the exact request-routing
# rules the live server runs (only index.php/oe-recovery.php reach PHP-FPM,
# everything else *.php is denied, /build/ is long-cached) can be exercised
# locally instead of first discovered in production.
#
# Differs from deploy/nginx/oeparts.conf ONLY in what has to differ for
# containers: fastcgi_pass targets the php-fpm service over TCP (production
# uses a unix socket on the same host), and root/server_name are fixed
# instead of placeholders. If you change a location block here, make the
# same change there, and vice versa — keeping the two in sync is the entire
# point of this file.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # gzip — mirrors deploy/nginx/oeparts.conf's block; see that file for the
    # full rationale (no compression was configured anywhere before this).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        font/woff2;

    # Matches public/.htaccess's / deploy/php-fpm/oeparts-pool-overrides.conf's
    # upload_max_filesize/post_max_size (config/imports.php's Bulk Product Import).
    client_max_body_size 1024M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hardened on purpose: routes ONLY index.php to PHP-FPM, matching
    # deploy/nginx/oeparts.conf's production rule.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # oe-recovery.php carve-out — see deploy/nginx/oeparts.conf for why this
    # exists (it must stay reachable even when the main app can't boot, and
    # the hardened `location = /index.php` rule above doesn't match it).
    location = /oe-recovery.php {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
    location ~* \.(env|log|sql|sqlite|lock)$ {
        deny all;
    }

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Mirrors deploy/nginx/oeparts.conf's /storage/ block — see that file
    # for why this is as safe to cache aggressively as /build/ above.
    location ^~ /storage/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/oeparts-access.log;
    error_log  /var/log/nginx/oeparts-error.log;
}
