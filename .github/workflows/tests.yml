name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }} — Laravel 12
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    # Some tests (CacheMetricsService and friends) deliberately exercise the
    # real Redis connection directly (Redis::connection('cache')), independent
    # of CACHE_STORE=array set for the rest of the suite — same as this
    # project's local Docker dev environment, which always has a real redis
    # container. Without this service those tests fail with
    # "RedisException: Connection refused", and — since the failure is
    # uncaught inside a RefreshDatabase-wrapped test — cascades into
    # transaction-state errors for unrelated tests sharing the same parallel
    # worker. Exposed on the default port with no extra config: this project's
    # redis config (config/database.php) already defaults to 127.0.0.1:6379,
    # matching a GitHub Actions services container with no host networking.
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # openssl (backup cipher), fileinfo/curl (download/upload), zip (release
          # zip + e2e ZipArchive), gd/intl (Filament) — the update-system e2e needs these.
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, xml, zip, openssl, fileinfo, curl, gd, intl
          coverage: pcov

      # Must run before `composer install` — its post-autoload-dump hook boots
      # the framework (artisan package:discover), which needs an APP_ENV/APP_KEY
      # to resolve cleanly.
      - name: Copy test environment
        run: cp .env.testing .env

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      # Prove every migration's up() applies cleanly in order on a fresh database.
      # down() reversibility for the update-system migrations is asserted in the suite
      # (UpdateSystemSchemaTest), and the full apply→rollback + backup→restore round-trips
      # are covered end-to-end by UpdateSystemE2ETest.
      - name: Verify migrations apply
        run: php artisan migrate:fresh --no-interaction

      # phpunit.xml forces DB_DATABASE=testing (a real SQLite file, not :memory:
      # like .env.testing — phpunit.xml's <env> wins during `php artisan test`).
      # `--parallel` (ParaTest) auto-creates this via Laravel's ParallelTesting
      # integration, but that's an undocumented side effect of the flag, not a
      # guarantee — touch it explicitly so this step never depends on it.
      - name: Create testing SQLite database file
        run: touch testing

      # Coverage only on one leg (8.4) — ParaTest merges per-worker coverage
      # into a single report; running it on all 3 PHP versions would just
      # triplicate the same artifact for no benefit.
      - name: Run tests
        run: php artisan test --parallel ${{ matrix.php == '8.4' && '--coverage-clover=coverage.xml' || '' }}

      - name: Upload coverage report
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  static-analysis:
    name: Static analysis (PHPStan + Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, xml, zip, openssl, fileinfo, curl, gd, intl
          coverage: none

      # Same as the test job — post-autoload-dump boots the framework.
      - name: Copy test environment
        run: cp .env.testing .env

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      # phpstan-baseline.neon (committed) snapshots pre-existing debt — this
      # only fails on NEW errors introduced from here on.
      - name: PHPStan
        run: composer analyse -- --error-format=github

      - name: Pint (code style)
        run: composer format:check

  e2e:
    name: Playwright e2e (admin + guest)
    runs-on: ubuntu-latest
    # Real Docker Sail stack, not a bespoke CI-only setup — tests/e2e/helpers.js's
    # artisan()/artisanOutput() shell out via `docker compose exec laravel.test`
    # (this dev environment runs entirely under Docker, no host PHP — see that
    # file's own comment), and auth.setup.js logs in through the real UI against
    # baseURL http://oeparts.test. Reusing the exact same compose.yaml here means
    # the e2e suite runs against the same stack contributors run it against
    # locally, instead of a second, divergent CI-only environment.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed on the RUNNER (not just in-container) only to populate
      # vendor/laravel/sail — compose.yaml's laravel.test/queue-worker build
      # context is vendor/laravel/sail/runtimes/8.4, a composer package, so it
      # must exist on disk before `docker compose build` can run. The
      # container's OWN vendor/ (used at runtime) is a separate named volume,
      # populated by the "Install PHP dependencies in container" step below —
      # same two-step "composer install once after first `up`" local dev does
      # (see compose.yaml's vendor-laravel-test volume comment).
      - name: Setup PHP (for the Sail build context only)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      # Must run before `composer install` — same reason as the `test` job's
      # "Copy test environment" step: its post-autoload-dump hook boots the
      # framework (artisan package:discover), and this app's boot path hits
      # the database (app/Support/LocaleRegistry.php) — confirmed live via a
      # QueryException connecting to 127.0.0.1:3306 (config/database.php's
      # bare fallback default) when no .env exists yet at this point. Use
      # .env.testing (sqlite, no external service needed) purely to survive
      # this HOST-side install cleanly — this step only needs vendor/laravel/sail
      # on disk for the Docker build context below, nothing about the app's
      # real runtime config. The real .env (MySQL/Redis-backed, for the
      # actual containers) is prepared after, overwriting this one.
      - name: Copy test environment (survives composer's post-install app boot only)
        run: cp .env.testing .env

      - name: Install dependencies (host, for the Sail build context)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # A full .env, not .env.testing: the e2e suite needs a real, persistent
      # MySQL/Redis-backed app (matching local dev), not the sqlite-in-memory/
      # array-driver setup the PHPUnit suite uses. .env.docker.overrides (env_file
      # in compose.yaml) supplies DB_HOST/REDIS_HOST/CACHE/SESSION/QUEUE/MAIL —
      # everything else (DB_DATABASE, APP_KEY, OE_BACKUP_KEY) comes from this base
      # .env, same division of concerns local dev relies on. Overwrites the
      # .env.testing copy above now that the host-side install is done.
      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=oeparts/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' .env
          echo "OE_BACKUP_KEY=$(openssl rand -base64 32)" >> .env

      # compose.yaml's laravel.test/queue-worker default WWWUSER/WWWGROUP to
      # 1000 (matching a typical local dev host user) when unset — but
      # actions/checkout's files are owned by the runner's own account,
      # UID/GID 1001 on GitHub-hosted ubuntu runners, not 1000. That mismatch
      # meant the container's sail user (1000) couldn't write into the
      # bind-mounted checkout at all — confirmed live: every page request
      # 500'd on `tempnam(): file created in the system's temporary directory`
      # the moment the framework tried to write anything (view cache, etc.),
      # which is also why every Playwright test timed out waiting for content
      # that was actually a Symfony/Laravel debug error page. Same fix Sail's
      # own docs give for this exact class of host/container UID mismatch.
      - name: Start the Docker Sail stack
        run: WWWUSER=$(id -u) WWWGROUP=$(id -g) docker compose up -d --build --wait

      # The container's own vendor/ is a separate named volume (vendor-laravel-test),
      # isolated from the host vendor/ above — see compose.yaml's comment on that
      # volume. Must run before artisan works inside the container at all.
      - name: Install PHP dependencies in container
        run: docker compose exec -T laravel.test composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: docker compose exec -T laravel.test php artisan key:generate

      # Full schema + the real DatabaseSeeder (roles, admin accounts including
      # superadmin@oeparts.test — see AdminSeeder — settings, demo catalog data
      # the guest storefront specs browse/search).
      - name: Migrate + seed
        run: docker compose exec -T laravel.test php artisan migrate:fresh --seed --force

      # playwright.config.js's baseURL is http://oeparts.test — laravel.test
      # publishes port 80 to the runner's host network (compose.yaml ports:
      # ${APP_PORT:-80}:80), so this just needs the hostname to resolve.
      - name: Point oeparts.test at the container
        run: echo "127.0.0.1 oeparts.test" | sudo tee -a /etc/hosts

      # DIAGNOSTIC (temporary): a live run showed every Playwright test timing
      # out waiting for page content that never appeared, with exactly one
      # fast (~1s) request per attempt and no follow-up asset requests — the
      # signature of a self-contained error page (e.g. Laravel's debug/Whoops
      # page needs no external CSS/JS), not a slow server. This bare curl
      # gets the raw HTTP response BEFORE involving the browser at all, for a
      # few seconds instead of the 60-120s Playwright waits per failed test.
      - name: DIAGNOSTIC — raw response from the admin login page
        run: curl -sv http://oeparts.test/admin/login 2>&1 | head -100

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # DIAGNOSTIC (temporary): scoped to the one test every other test
      # depends on (the auth setup project), instead of the full 579-test
      # suite — the prior run took 1h18m because every one of ~30 distinct
      # failures burned its own 60-120s timeout (plus a retry). This narrows
      # one diagnostic iteration to a few minutes. Revert to the bare `npm
      # run test:e2e` once the underlying page-not-rendering cause is fixed.
      - name: Run Playwright e2e suite
        run: npm run test:e2e -- --grep "authenticate as super_admin"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump Laravel application logs on failure
        if: failure()
        run: docker compose exec -T laravel.test bash -c "tail -c 20000 storage/logs/*.log 2>/dev/null || echo 'no log files found'"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs laravel.test queue-worker mysql redis

      - name: Stop the Docker Sail stack
        if: always()
        run: docker compose down -v
