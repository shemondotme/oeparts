services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            # PHP's built-in server (see SUPERVISOR_PHP_COMMAND below) handles one
            # request at a time by default — a real browser loading a page fires
            # a burst of concurrent requests (HTML, CSS, JS, fonts, images, plus
            # any XHR/fetch calls), and every request past the first queues behind
            # whichever one the server is currently serving. Confirmed empirically:
            # this alone stalled the OEM-autocomplete fetch on /parts for ~22s
            # during Playwright testing even though the endpoint itself resolves
            # in well under a second in isolation (bare curl). pcntl is present in
            # this image, so this env var alone (no command change) is enough for
            # `php -S` to fork a small worker pool and actually serve requests
            # concurrently, matching real request-level concurrency in prod.
            PHP_CLI_SERVER_WORKERS: 4
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Sail's default web server is `php artisan serve`, which spawns its
            # real dev-server process via Symfony Process — confirmed empirically
            # that spawned child does NOT reliably inherit env_file-sourced
            # container env vars (DB_HOST etc. from .env.docker.overrides resolved
            # correctly everywhere else — exec, tinker, a direct `php -S` — but
            # not through this specific child process). Run PHP's built-in server
            # directly instead, same fix as the hostingsim service.
            #
            # Router MUST be docker/serve-router.php, NOT public/index.php
            # directly — index.php never `return false`s for a request whose
            # path matches a real file on disk, so every request (including
            # existing static assets under public/build/*) gets bootstrapped
            # through the full Laravel kernel instead of served as a file; the
            # locale-detection middleware then 302-redirects asset requests
            # (e.g. app.css -> app.css/en), which is why the storefront loaded
            # with completely broken CSS/JS. docker/serve-router.php is a copy
            # of Laravel's own vendor/.../resources/server.php (the router
            # `artisan serve` uses internally for exactly this) with a fix: the
            # original derives the public path from getcwd(), which assumes
            # cwd is already public/ — false here, since supervisor starts PHP
            # with cwd = /var/www/html (the container WORKDIR).
            SUPERVISOR_PHP_COMMAND: 'php -d variables_order=EGPCS -S 0.0.0.0:80 -t /var/www/html/public /var/www/html/docker/serve-router.php'
        env_file:
            - .env.docker.overrides
        volumes:
            - '.:/var/www/html'
            # vendor/ is an isolated named volume, NOT part of the Windows bind
            # mount above: Docker Desktop's Windows file-sharing layer silently
            # TRUNCATES large RecursiveDirectoryIterator scans over a bind mount
            # (confirmed empirically — blade-heroicons' ~1288-file SVG directory
            # scanned to only 515 entries over the bind mount, but scanned
            # correctly, in full, from an isolated volume). Run `composer
            # install` once after first `up` to populate it.
            - 'vendor-laravel-test:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit
    mysql:
        image: 'mysql:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            # Hardcoded, NOT ${DB_USERNAME}/${DB_PASSWORD}: the real .env (shared
            # with XAMPP, see .env.docker.overrides) has DB_USERNAME=root, and the
            # official mysql image's entrypoint REJECTS MYSQL_USER=root outright
            # (confirmed — it crash-loops with "MYSQL_USER and MYSQL_PASSWORD are
            # for configuring a regular user and cannot be used for the root
            # user"). This account is what laravel.test/queue-worker actually
            # connect as, via .env.docker.overrides' DB_USERNAME/DB_PASSWORD.
            MYSQL_USER: sail
            MYSQL_PASSWORD: password
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    # Always-on: processes the app's three real queues (see app/Jobs — 'critical'
    # is order confirmation/OTP/password-reset/webhook/invoice, 'default' is
    # tracking/newsletter/backup/admin-notification mail, 'low' is SendTestEmailJob).
    queue-worker:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.4/app'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        env_file:
            - .env.docker.overrides
        volumes:
            - '.:/var/www/html'
            # Same image/PHP version as laravel.test — shares its vendor volume
            # (see laravel.test's volumes comment for why this isn't bind-mounted).
            - 'vendor-laravel-test:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        command: 'php artisan queue:work redis --queue=critical,default,low --tries=3 --backoff=3,10,30 --sleep=1'
        restart: unless-stopped

    # --- Opt-in: PHP 8.x compatibility matrix (docker compose --profile matrix ...) ---
    # Floor is 8.3, NOT 8.2: filament/actions' openspout/openspout dependency (v4.32.0)
    # requires PHP ~8.3.0 || ~8.4.0 || ~8.5.0 — a real upstream constraint, confirmed by
    # a failed `composer install` under PHP 8.2 (Filament export features pull it in).
    # Each version gets its own named vendor volume so `composer install` output never
    # crosses PHP versions. Run via: docker/run-matrix.sh (composer test:matrix).
    php83:
        build:
            context: './vendor/laravel/sail/runtimes/8.3'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.3/app'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            # Matrix containers are disposable one-shot test runners (not the
            # persistent dev container), and the named vendor-phpNN volume is
            # root-owned by default — running as root here avoids a permission
            # error when `composer install` tries to create vendor/<pkg> dirs.
            SUPERVISOR_PHP_USER: root
        volumes:
            - '.:/var/www/html'
            - 'vendor-php83:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        profiles: ['matrix']

    php85:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: root
        volumes:
            - '.:/var/www/html'
            - 'vendor-php85:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        profiles: ['matrix']

    # --- Opt-in: shared-hosting simulation (docker compose --profile hostingsim up) ---
    # Reuses the 8.3 runtime image (the most common shared-host default) and mounts a
    # restrictive php.ini (exec/proc_open/etc. disabled — see docker/hostingsim/) plus
    # env overrides forcing sync queue / file cache+session / log mail, so the
    # Update/Backup/Recovery system (CLAUDE.md rules #41-52) can be validated without
    # any of the conveniences (Redis, a worker, shell functions) real shared hosting
    # doesn't guarantee.
    hostingsim:
        build:
            context: './vendor/laravel/sail/runtimes/8.3'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.3/app'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            # `php artisan serve` launches its real server via Symfony Process,
            # which requires proc_open — exactly what this container disables.
            # Run PHP's built-in server directly instead (what artisan serve
            # wraps anyway), so the web server itself doesn't need proc_open.
            # Router MUST be docker/serve-router.php, not index.php directly —
            # see the matching comment on laravel.test's SUPERVISOR_PHP_COMMAND
            # above for why (index.php never serves static files as-is, so
            # every public/build/* asset request gets 302-redirected by locale
            # middleware instead of served).
            SUPERVISOR_PHP_COMMAND: 'php -d variables_order=EGPCS -S 0.0.0.0:80 -t /var/www/html/public /var/www/html/docker/serve-router.php'
        env_file:
            - .env.docker.hostingsim
        volumes:
            - '.:/var/www/html'
            # Same PHP version/image as the php83 matrix service — shares its
            # vendor volume (see laravel.test's volumes comment: vendor/ must
            # not be part of the Windows bind mount above).
            - 'vendor-php83:/var/www/html/vendor'
            - './docker/hostingsim/php.ini-overrides:/etc/php/8.3/cli/conf.d/99-hostingsim.ini:ro'
        ports:
            - '${HOSTINGSIM_PORT:-8080}:80'
        networks:
            - sail
        depends_on:
            - mysql
        profiles: ['hostingsim']

    # --- Opt-in: nginx + PHP-FPM parity environment (docker compose --profile nginx up) ---
    # The live server runs nginx + PHP-FPM (deploy/nginx/oeparts.conf,
    # deploy/php-fpm/oeparts-pool-overrides.conf) — every other service above
    # runs PHP's built-in server instead, which never exercises nginx's own
    # request routing. This profile runs the real thing, so nginx-specific
    # behavior (the index.php/oe-recovery.php-only PHP-FPM carve-out, static
    # asset caching, nginx's own upload-size cap) gets caught locally instead
    # of first discovered live.
    php-fpm:
        build:
            context: './docker/php-fpm'
        image: 'oeparts/php-fpm:8.3'
        env_file:
            - .env.docker.overrides
        volumes:
            - '.:/var/www/html'
            # Pure-PHP vendor/ (no compiled extensions in the tree itself) —
            # safe to share with laravel.test/queue-worker's PHP 8.4 install;
            # see laravel.test's volumes comment for why this is an isolated
            # named volume rather than part of the Windows bind mount above.
            - 'vendor-laravel-test:/var/www/html/vendor'
            # Bind-mounted straight from deploy/, not copied into the image,
            # so this profile reads the exact file production does — no
            # second copy of upload/execution-limit overrides to keep in sync.
            # Mounted outside php-fpm.d/ on purpose (see docker/php-fpm/pool.conf,
            # which pulls it in from here already wrapped in a [www] section).
            - './deploy/php-fpm/oeparts-pool-overrides.conf:/etc/oeparts/php-fpm-pool-overrides.conf:ro'
            - './docker/php-fpm/pool.conf:/usr/local/etc/php-fpm.d/99-oeparts-pool.conf:ro'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        profiles: ['nginx']

    nginx:
        image: 'nginx:alpine'
        ports:
            - '${NGINX_PORT:-8081}:80'
        volumes:
            # Whole project, read-only — not just public/ — so public/storage
            # (the storage:link symlink to ../storage/app/public) actually
            # resolves; nginx only ever reads from it, never writes.
            - '.:/var/www/html:ro'
            - './docker/nginx/oeparts.docker.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            - php-fpm
        profiles: ['nginx']
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    vendor-laravel-test:
        driver: local
    vendor-php83:
        driver: local
    vendor-php85:
        driver: local
