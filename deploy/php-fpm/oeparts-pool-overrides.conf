; PHP-FPM pool overrides for OeParts — upload size / execution time.
;
; public/.htaccess raises these same four values, but ONLY under mod_php —
; PHP-FPM (what nginx always uses, and what most modern Apache setups also
; use via mod_proxy_fcgi) silently ignores .htaccess's php_value directives
; entirely. Without this file (or the equivalent set directly in your pool's
; php.ini), Bulk Product Import (config/imports.php, OE_IMPORT_MAX_UPLOAD_KB)
; will truncate/reject large CSV uploads under PHP-FPM regardless of which
; web server sits in front of it — this is a PHP-FPM-vs-mod_php gap, not an
; nginx-vs-Apache one.
;
; Install: paste these lines into your pool's .conf file (e.g.
; /etc/php/8.3/fpm/pool.d/www.conf, or a new pool.d/oeparts.conf if OeParts
; runs in its own pool), then: systemctl restart php8.3-fpm
;
; If nginx sits in front, ALSO raise client_max_body_size in your server
; block (see deploy/nginx/oeparts.conf) — nginx enforces its own upload cap
; before a request ever reaches PHP-FPM, independent of these values.

php_admin_value[upload_max_filesize] = 1024M
php_admin_value[post_max_size] = 1024M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
