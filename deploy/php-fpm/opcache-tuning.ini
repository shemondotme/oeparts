; OPcache tuning for OeParts — server response time / Core Web Vitals LCP.
;
; Unlike oeparts-pool-overrides.conf (a PER-POOL php_admin_value file),
; these are PHP_INI_SYSTEM-scope opcache directives — opcache initializes
; ONE shared-memory segment when the PHP-FPM MASTER process starts, shared
; across every pool/worker, so these values cannot be set per-pool via
; php_admin_value the way upload_max_filesize etc. can. They must live in
; the actual php.ini or a file your php.ini's `opcache.so`/zend_extension
; line already loads.
;
; Install (adjust the PHP version path to match your server):
;   sudo cp opcache-tuning.ini /etc/php/8.3/fpm/conf.d/99-opcache-tuning.ini
;   sudo systemctl restart php8.3-fpm
;
; (On a system where FPM and CLI share conf.d, this also affects CLI —
; harmless, opcache.enable_cli=0 below keeps CLI un-cached as intended.)
;
; validate_timestamps is DELIBERATELY left at its default (1), not 0: 0
; skips checking whether a source file changed since being cached, which
; only stays safe if your deploy process explicitly resets opcache (a
; php-fpm reload, or an opcache_reset() endpoint) after every release. If
; your deploy pipeline doesn't already do that, leave this alone — a stale
; deploy silently not taking effect is a worse production incident than the
; small per-request file-mtime-check cost accepted here.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit_buffer_size=64M
