; Supervisor config for the OeParts queue worker.
;
; Install: copy this file to /etc/supervisor/conf.d/, replace every
; /path/to/oeparts placeholder with the real deployment path, then run:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start oeparts-queue-worker:*
;
; --queue=migration,critical,default,low lists all four queues in priority order —
; order confirmations, OTP, password resets, invoice generation, and
; Airwallex payment-webhook processing all run on 'critical'. Omitting a
; queue name here means jobs dispatched to it are silently never processed —
; 'low' (e.g. the admin "send test email" feature) is easy to miss since it's
; not documented alongside critical/default elsewhere.
;
; 'migration' carries the site export/import jobs and nothing else. 'migration' comes FIRST
; so its short driver job is never starved, and it must be on the line because a freeze export
; pauses the customer queues (critical, default, low) while it runs: the job that drives
; the export would otherwise wait on a queue that the same freeze has paused. If you are
; upgrading, edit your command to add 'migration' and restart the worker. A very large
; site may run a second, dedicated worker with --queue=migration.
;
; stopwaitsecs must exceed the longest-running job's own $timeout
; (ProcessCsvImport.php declares $timeout=3600 for large catalog
; imports). Supervisor's own default (10s) would SIGKILL a legitimately
; still-running hour-long import the moment a deploy restarts the
; worker; 3700 gives it the full hour plus a buffer to finish cleanly.
;
; --max-time=3600 is the standard Laravel-recommended periodic self
; restart for long-running PHP worker processes (mitigates memory
; growth); autorestart=true respawns it immediately afterward.

[program:oeparts-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/oeparts/artisan queue:work redis --queue=migration,critical,default,low --sleep=3 --tries=3 --max-time=3600
directory=/path/to/oeparts
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/oeparts/storage/logs/queue-worker.log
stopwaitsecs=3700
; user=www-data ; uncomment and set to your web server's user
