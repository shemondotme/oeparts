# Nginx server block for OeParts.
#
# Install: copy to /etc/nginx/sites-available/oeparts.conf, replace every
# /path/to/oeparts and your-domain.com placeholder, symlink into
# sites-enabled/, then: nginx -t && systemctl reload nginx
#
# Document root MUST be the project's public/ directory, never the project
# root — .env, storage/, vendor/, database/, .git and composer.json/lock all
# live one level above public/ and are only kept out of reach because nginx
# never serves anything outside `root`. Pointing root at the project root
# instead of public/ exposes all of those directly over HTTP; nothing else
# in this config (or in Apache's public/.htaccess) guards against that
# specific misconfiguration.
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    root /path/to/oeparts/public;

    index index.php;

    charset utf-8;

    # Text-based responses (HTML/CSS/JS/JSON/SVG/fonts) compressed before
    # sending — no compression was configured anywhere (neither here nor in
    # public/.htaccess), so every response shipped uncompressed. gzip is
    # built into the standard nginx package (no extra module install);
    # `gzip_vary on` sends `Vary: Accept-Encoding` so any cache in front
    # (Cloudflare, a browser cache) stores compressed/uncompressed variants
    # separately instead of serving one to a client that can't handle it.
    # Excludes already-compressed formats (images) — recompressing those
    # wastes CPU for zero size benefit.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        font/woff2;

    # Matches public/.htaccess's upload_max_filesize/post_max_size override.
    # This is nginx's OWN cap (independent of php.ini) — without raising it
    # here too, nginx itself rejects large CSV uploads (Bulk Product Import,
    # config/imports.php's OE_IMPORT_MAX_UPLOAD_KB) with a 413 before the
    # request ever reaches PHP-FPM, regardless of what php.ini allows.
    client_max_body_size 1024M;

    # Standard Laravel front-controller rewrite — matches public/.htaccess's
    # RewriteCond/RewriteRule behavior (serve real files/dirs as-is,
    # otherwise hand everything to index.php).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hardened on purpose: routes ONLY index.php to PHP-FPM, not every *.php
    # file, so a stray/uploaded .php file anywhere under public/ can never be
    # executed. This is a common, recommended nginx hardening pattern for
    # Laravel — but it has one deliberate carve-out below for oe-recovery.php.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # adjust to your PHP-FPM pool socket/port
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # oe-recovery.php (config/updates.php's app-independent recovery console,
    # see README's "In-App Update & Recovery System" section and SECURITY.md)
    # is deliberately NOT routed through index.php/Laravel — it must keep
    # working even when the main app can't boot. The hardened `location =
    # /index.php` rule above does NOT match this file (nginx location = is an
    # exact match), so without this explicit block the recovery console 404s
    # under this config even though the file exists on disk and Apache would
    # serve it fine. It's gated by its own key/IP-allowlist regardless
    # (config/updates.php's OE_RECOVERY_KEY / OE_RECOVERY_IP_ALLOWLIST) —
    # this block only makes it reachable, not unauthenticated.
    location = /oe-recovery.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # must match the socket above
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Every other *.php request (i.e. anything that isn't index.php or
    # oe-recovery.php) is refused outright rather than silently 404ing via
    # Laravel — matches the "only these two scripts may ever execute"
    # intent above.
    location ~ \.php$ {
        deny all;
    }

    # Defense in depth even though these paths already sit outside `root`:
    # blocks dotfiles (.env, .git, .htaccess) and common non-public
    # extensions if a future change ever moves something into public/ by
    # mistake, or a host aliases an extra path into this server block.
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|log|sql|sqlite|lock)$ {
        deny all;
    }

    # Long-cache the versioned Vite build output (public/build/**, filenames
    # are content-hashed) — safe to cache aggressively since a new deploy
    # always ships new filenames, never overwrites an old one in place.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media (product/manufacturer/blog images, via the storage:link
    # symlink at public/storage/ → storage/app/public/) had NO caching
    # headers at all — every repeat view re-validated with the origin.
    # Laravel's default upload flow (`$file->store(...)`, no explicit
    # filename) always generates a random, unique filename — an admin
    # re-uploading a replacement image never overwrites the old file at the
    # same path — so this is exactly as safe to cache aggressively as the
    # content-hashed /build/ output above.
    location ^~ /storage/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/oeparts-access.log;
    error_log  /var/log/nginx/oeparts-error.log;
}

# HTTPS: terminate TLS here (recommended) or on an upstream load balancer.
# If TLS terminates upstream instead of on this nginx, set TRUSTED_PROXIES
# in .env (see .env.example) so Laravel trusts the upstream's
# X-Forwarded-Proto/X-Forwarded-For headers — otherwise the app can
# generate http:// URLs behind an HTTPS-terminating proxy and IP-based
# blocking (IpBlocklist) sees the proxy's IP instead of the real client.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name your-domain.com www.your-domain.com;
#     root /path/to/oeparts/public;
#     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     # ... duplicate every block from the :80 server above ...
# }
